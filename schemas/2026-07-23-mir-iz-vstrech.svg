<svg viewBox="0 0 880 665" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Живите как хотите — мир из встреч (суть-схема, 2026-07-23)</title>
  <desc>Люди с внутренней логикой пересекаются во встречах; игрок действует как случай внутри круга взгляда; из встреч копится летопись, толкования узора рождают идеологию; мир растёт петлёй новых людей.</desc>
  <defs>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="665" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" fill="#888780">Живите как хотите — мир из встреч · 2026-07-23</text>

  <circle cx="410" cy="30" r="8" fill="#ba7517"/>
  <text x="425" y="34" font-size="12" fill="#5f5e5a">ядро</text>
  <g stroke="#b4b2a9" stroke-width="1.2" fill="none">
    <line x1="404" y1="36" x2="176" y2="74"/>
    <line x1="408" y1="39" x2="332" y2="72"/>
    <line x1="414" y1="39" x2="488" y2="72"/>
    <line x1="416" y1="36" x2="644" y2="74"/>
  </g>

  <g fill="#faf9f5" stroke="#888780" stroke-width="1.6">
    <circle cx="170" cy="100" r="26"/>
    <circle cx="330" cy="100" r="26"/>
    <circle cx="490" cy="100" r="26"/>
    <circle cx="650" cy="100" r="26"/>
  </g>
  <g stroke="#5f5e5a" stroke-width="1.6" fill="none">
    <circle cx="170" cy="93" r="4.5"/><path d="M161,110 Q170,98 179,110"/>
    <circle cx="330" cy="93" r="4.5"/><path d="M321,110 Q330,98 339,110"/>
    <circle cx="490" cy="93" r="4.5"/><path d="M481,110 Q490,98 499,110"/>
    <circle cx="650" cy="93" r="4.5"/><path d="M641,110 Q650,98 659,110"/>
  </g>
  <g font-size="12" fill="#5f5e5a" text-anchor="middle">
    <text x="170" y="144">Упрямая</text>
    <text x="330" y="144">Добрый</text>
    <text x="490" y="144">Пугливый</text>
    <text x="650" y="144">Любопытная</text>
  </g>
  <text x="862" y="94" font-size="12" fill="#888780" text-anchor="end">каждый живёт</text>
  <text x="862" y="110" font-size="12" fill="#888780" text-anchor="end">по своей логике</text>

  <circle cx="415" cy="278" r="62" fill="#f1efe8" stroke="#ba7517" stroke-width="1.4" stroke-dasharray="3 5"/>
  <text x="60" y="258" font-size="12.5" fill="#ba7517">где взгляд — там судьба</text>

  <g stroke="#888780" stroke-width="1.5" fill="none" stroke-dasharray="4 5">
    <path d="M330,126 Q330,205 404,266"/>
    <path d="M490,126 Q490,205 427,266"/>
    <path d="M170,126 C185,300 520,395 703,330"/>
    <path d="M650,126 Q678,235 698,316"/>
  </g>
  <circle cx="700" cy="322" r="5" fill="none" stroke="#888780" stroke-width="1.5"/>
  <text x="700" y="352" font-size="11" fill="#888780" text-anchor="middle">встреча без взгляда — чистый хаос</text>

  <g stroke="#ba7517" fill="none" stroke-width="1.8">
    <path d="M389,185 Q415,167 441,185 Q415,203 389,185 z"/>
  </g>
  <circle cx="415" cy="185" r="5.5" fill="#ba7517"/>
  <line x1="415" y1="203" x2="415" y2="214" stroke="#ba7517" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="455" y="180" font-size="12.5" font-weight="600" fill="#2c2c2a">игрок = случай (промысел)</text>
  <text x="455" y="198" font-size="12" fill="#5f5e5a">свести · развести · шепнуть · бросить кость</text>

  <circle cx="415" cy="278" r="8" fill="#ba7517"/>
  <g stroke="#5f5e5a" stroke-width="1.4" fill="none" marker-end="url(#mi)">
    <line x1="408" y1="285" x2="338" y2="340"/>
    <line x1="415" y1="288" x2="415" y2="344"/>
    <line x1="422" y1="285" x2="492" y2="340"/>
  </g>
  <g font-size="11.5" fill="#5f5e5a" text-anchor="middle">
    <text x="330" y="362">мимо</text>
    <text x="415" y="364">вражда</text>
    <text x="500" y="362">дружба</text>
  </g>

  <path d="M398,375 C330,412 262,438 234,464" stroke="#5f5e5a" stroke-width="1.4" fill="none" marker-end="url(#mi)"/>

  <rect x="90" y="472" width="280" height="140" rx="10" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1.4"/>
  <text x="106" y="496" font-size="12" font-weight="600" fill="#2c2c2a">ЛЕТОПИСЬ — пишется сама</text>
  <g font-size="12" fill="#5f5e5a" font-family="Georgia, serif">
    <text x="106" y="521">д.3 — ссора у колодца</text>
    <text x="106" y="543">д.9 — Упрямая ушла за реку</text>
    <text x="106" y="565">д.17 — первый обмен: рыба на соль</text>
    <text x="106" y="587">д.31 — Пугливый теперь «вождь»?</text>
  </g>

  <path d="M372,532 L420,530" stroke="#5f5e5a" stroke-width="1.3" fill="none" marker-end="url(#mi)"/>
  <text x="396" y="518" font-size="10.5" fill="#888780" text-anchor="middle">узор повторов</text>
  <ellipse cx="533" cy="532" rx="106" ry="50" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="533" y="520" font-size="12" font-weight="600" fill="#2c2c2a" text-anchor="middle">ИДЕОЛОГИЯ</text>
  <text x="533" y="538" font-size="11" fill="#5f5e5a" text-anchor="middle">жители толкуют узор руки:</text>
  <text x="533" y="554" font-size="11" fill="#5f5e5a" text-anchor="middle">вера · приметы · нигилизм</text>

  <path d="M645,505 C 790,465 812,250 692,132" stroke="#5f5e5a" stroke-width="1.4" fill="none" marker-end="url(#mi)"/>
  <text x="800" y="330" font-size="11.5" fill="#5f5e5a">мир растёт:</text>
  <text x="800" y="346" font-size="11.5" fill="#5f5e5a">новые люди</text>

  <text x="440" y="650" font-size="15" text-anchor="middle" fill="#2c2c2a">
    <tspan font-weight="600">история</tspan>
    <tspan> = внутренняя логика </tspan>
    <tspan fill="#ba7517" font-weight="600">× встречи</tspan>
  </text>
</svg>
