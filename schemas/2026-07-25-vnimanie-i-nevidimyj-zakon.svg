<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Концепт: внимание и невидимый закон (2026-07-25)</title>
  <desc>Три слоя. Сверху глаз игрока льёт конус внимания на мир; куда смотрит — жизнь распускается в ИИ-сцены, вне взгляда идёт дёшево слухом. В середине живой мир Москвы с одной освещённой нитью — судьбой опричника. Внизу пунктиром невидимый закон: страх, донос, вера, власть, нужда — известный нам, скрытый от жителей; разрыв между ним и их верой и есть тайна.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" fill="#888780">Концепт: внимание и невидимый закон · опричнина · 2026-07-25</text>

  <path d="M450,112 L250,320 L650,320 Z" fill="#EF9F27" opacity="0.12"/>
  <path d="M450,112 L250,320 M450,112 L650,320" stroke="#EF9F27" stroke-width="1" opacity="0.5"/>

  <g stroke="#ba7517" fill="none" stroke-width="2">
    <path d="M416,94 Q450,70 484,94 Q450,118 416,94 z"/>
  </g>
  <circle cx="450" cy="94" r="7" fill="#ba7517"/>
  <text x="500" y="86" font-size="12.5" font-weight="600" fill="#2c2c2a">взгляд игрока</text>
  <text x="500" y="102" font-size="11.5" fill="#5f5e5a">внимание = и рычаг, и бюджет ИИ</text>

  <text x="40" y="168" font-size="12" font-weight="600" fill="#2c2c2a">живой мир — Москва, посад, XVI век</text>
  <text x="40" y="186" font-size="11" fill="#888780">культура · вера · архитектура · мифология растут по принципам</text>

  <g stroke="#888780" stroke-width="1.4" fill="#f1efe8">
    <path d="M120,320 v-26 h30 v26 z M116,294 L135,278 L154,294"/>
    <path d="M180,320 v-22 h26 v22 z M176,298 L193,283 L210,298"/>
    <path d="M740,320 v-24 h28 v24 z M736,296 L754,280 L772,296"/>
    <path d="M800,320 v-20 h24 v20 z M796,300 L812,286 L828,300"/>
  </g>
  <g fill="#888780" opacity="0.55">
    <circle cx="135" cy="312" r="4"/><circle cx="815" cy="312" r="4"/><circle cx="760" cy="310" r="4"/>
  </g>
  <text x="70" y="350" font-size="10.5" fill="#888780" text-anchor="middle" font-style="italic">вне взгляда —</text>
  <text x="70" y="364" font-size="10.5" fill="#888780" text-anchor="middle" font-style="italic">дёшево, доходит слухом</text>

  <path d="M450,320 C420,260 500,220 450,170 C410,225 480,270 450,320" fill="none" stroke="#D85A30" stroke-width="2.4"/>
  <circle cx="450" cy="320" r="8" fill="#D85A30"/>
  <g fill="#D85A30"><circle cx="410" cy="306" r="4.5"/><circle cx="492" cy="304" r="4.5"/></g>
  <text x="450" y="270" font-size="11.5" font-weight="600" fill="#ba7517" text-anchor="middle">судьба опричника</text>
  <text x="450" y="350" font-size="10.5" fill="#5f5e5a" text-anchor="middle">за ней следишь — тут жизнь распускается (ИИ)</text>

  <line x1="40" y1="392" x2="670" y2="392" stroke="#b4b2a9" stroke-width="1.2"/>

  <rect x="40" y="404" width="630" height="120" rx="10" fill="#7F77DD" opacity="0.10"/>
  <text x="56" y="428" font-size="12" font-weight="600" fill="#2c2c2a">невидимый закон — принципы, по которым всё движется</text>
  <g font-size="12.5" fill="#534AB7" font-weight="600">
    <text x="80" y="466">страх</text><text x="185" y="466">донос</text><text x="290" y="466">вера</text><text x="380" y="466">власть</text><text x="490" y="466">нужда</text>
  </g>
  <g stroke="#7F77DD" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.6">
    <line x1="56" y1="480" x2="654" y2="480"/>
    <line x1="56" y1="494" x2="654" y2="494"/>
  </g>
  <text x="56" y="514" font-size="11" fill="#5f5e5a">знаем мы — скрыто от жителей · они верят, что движет Бог, судьба, царь</text>

  <path d="M690,320 Q740,380 700,450" stroke="#5f5e5a" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#a2)"/>
  <text x="748" y="380" font-size="11.5" font-weight="600" fill="#2c2c2a">тайна =</text>
  <text x="748" y="397" font-size="11" fill="#5f5e5a">разрыв между тем,</text>
  <text x="748" y="412" font-size="11" fill="#5f5e5a">что движет миром,</text>
  <text x="748" y="427" font-size="11" fill="#5f5e5a">и во что верят люди</text>

  <rect x="700" y="140" width="176" height="150" rx="10" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1.3"/>
  <text x="716" y="162" font-size="11.5" font-weight="600" fill="#2c2c2a">летопись в два голоса</text>
  <text x="716" y="186" font-size="11" fill="#5f5e5a">что случилось —</text>
  <text x="716" y="202" font-size="11" fill="#888780" font-style="italic">«взяли соседа ночью»</text>
  <text x="716" y="228" font-size="11" fill="#5f5e5a">как это назовут —</text>
  <text x="716" y="244" font-size="11" fill="#ba7517" font-style="italic" font-family="Georgia,serif">«на него пал</text>
  <text x="716" y="260" font-size="11" fill="#ba7517" font-style="italic" font-family="Georgia,serif">государев гнев»</text>
</svg>
